<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | DevilMC Network</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/AfFp7pu.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #e63946;
            --primary-hover: #d62828;
            --bg-glass: rgba(18, 20, 26, 0.88);
            --border: rgba(255, 255, 255, 0.08);
            --text-light: #f8f9fa;
            --text-muted: #a9aeb7;
            --radius-lg: 16px;
            --radius-md: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body {
            background: #0b0c10 radial-gradient(circle at 50% 20%, rgba(230, 57, 70, 0.2), transparent 70%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            backdrop-filter: blur(14px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
        }
        .logo { font-size: 1.8rem; font-weight: 900; margin-bottom: 24px; text-transform: uppercase; }
        .logo span { color: var(--primary); text-shadow: 0 0 12px rgba(230, 57, 70, 0.5); }
        .avatar-preview-box {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: rgba(0,0,0,0.5);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }
        .avatar-preview-box img {
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
        }
        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .input-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.2); }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(230, 57, 70, 0.4); }
        .back-link { display: inline-block; margin-top: 20px; color: var(--text-muted); font-size: 0.88rem; text-decoration: none; }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo"><i class="fa-solid fa-fire" style="color: var(--primary);"></i> DEVIL<span>MC</span></div>
        
        <div class="avatar-preview-box">
            <img id="skinAvatar" src="https://minotar.net/helm/Steve/64.png" alt="Skin Avatar">
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Minecraft Kullanıcı Adın</label>
                <input type="text" id="username" placeholder="Örn: DevilWarrior" required autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password">Şifren</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn"><i class="fa-solid fa-arrow-right-to-bracket"></i> Hesaba Giriş Yap</button>
        </form>

        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Dön</a>
    </div>

    <script>
        const usernameInput = document.getElementById('username');
        const skinAvatar = document.getElementById('skinAvatar');
        const loginForm = document.getElementById('loginForm');

        let timer;
        usernameInput.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                const val = usernameInput.value.trim();
                if (val.length >= 3) {
                    skinAvatar.src = 'https://minotar.net/helm/' + encodeURIComponent(val) + '/64.png';
                } else {
                    skinAvatar.src = 'https://minotar.net/helm/Steve/64.png';
                }
            }, 300);
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = usernameInput.value.trim();
            if (!val) return;

            const userData = {
                username: val,
                credits: 250,
                rank: 'DEVIL-VIP+',
                loginDate: new Date().toLocaleDateString('tr-TR')
            };

            localStorage.setItem('devilmc_user', JSON.stringify(userData));
            alert('Giriş başarılı! Hoş geldin ' + val);
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
